# Channel settings. Claude Code can edit this file for you.

channel:
  name: "Umrah Asaan"
  handle: "@UmrahAsaann"
  logo: channel/brand/profile-800.png   # small logo in the video corner
  bible: channel/bible.md        # who the videos are for, tone, rules

voice:
  # Free Microsoft Edge voices. List them with:  python run.py --voices en
  # Urdu examples: ur-PK-AsadNeural (male), ur-PK-UzmaNeural (female)
  name: ur-PK-AsadNeural
  rate: "-5%"                    # "-10%" slower, "+10%" faster

video:
  width: 1920
  height: 1080
  fps: 30
  seconds_per_visual: 6          # how long each image or clip stays on screen
  captions: true                 # burn subtitles into the video
  music_volume: 0.08             # background music level (files in assets/music/)
  darken_images: 0.35            # darken your photos so text stays readable (0 = off)
  font: Arial                    # font for captions and title cards (must support Urdu)

shorts:
  seconds_per_visual: 3          # Shorts change picture faster
  max_seconds: 60                # warn above this (hard limit 180)

thumbnail:
  font: ""                       # optional path to a bold .ttf font
  text_rgb: [255, 210, 63]
  background_rgb: [14, 63, 61]

youtube:
  language: ur                   # use "en" for English videos
  made_for_kids: false
